<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weekday number</title>
</head>
<body>
    <h1>WEEKDAY NUMBER</h1>
    <input id="day" text="number"placeholder="enter a number between(1-7)">
    <button onclick="weekday()">submit</button>   
    <p id="result"></p> 
    <script>
        const weekday = () =>{
            let day =Number(document.getElementById("day").value);
            let result=document.getElementById("result");

            if(day === 1){
                result.innerText="Monday";
            }else if(day === 2){
                result.innerText="Tuesday";
            }else if(day === 3){
                result.innerText="Wednesday";
            }else if(day === 4){
                result.innerText="Thursday";
            }else if(day === 5){
                result.innerText="Friday";
            }else if(day === 6){
                result.innerText="Saturday";
            }else if(day === 7){
                result.innerText="sunday";
            }
        };
    </script>
</body>
</html>
