<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guess the number</title>
<style>
    body{
        background-color: rgb(202, 152, 249);
    }
</style>
</head>
<body>
    <h1>NUMBER GUESSING GAME</h1>
    <P>Guess a number between 1 to 10</P>
    <input id="guess" type="number" placeholder="enter your guess number(1-10)">
    <button onclick="guessnumber()">guess</button>
    <p id="result"></p>

    <script>
        const randomNumber = Math.floor(Math.random() * 10) + 1;
        const guessnumber = () => {
            let userguess = Number(document.getElementById("guess").value);
            let result = document.getElementById("result");

            if (userguess === randomNumber){
                result.innerText="correct! you guessed it";

            }else if(userguess > randomNumber){
                result.innerText="too high! try again";
            }else {
                result.innerText="too low! try again";
            }
        };
    </script>
</body>
</html>
